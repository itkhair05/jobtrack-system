services:
  mysql:
    image: mysql:8.4
    container_name: jobtrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jobtrack_db
      MYSQL_USER: jobtrack
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - jobtrack_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: jobtrack-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/jobtrack_db?useSSL=false&serverTimezone=UTC
      DB_USERNAME: jobtrack
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      UPLOAD_DIRECTORY: /var/lib/jobtrack/uploads/cvs
    ports:
      - "8080:8080"
    volumes:
      - jobtrack_cv_uploads:/var/lib/jobtrack/uploads/cvs

volumes:
  jobtrack_mysql_data:
  jobtrack_cv_uploads: