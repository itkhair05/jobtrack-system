# Local development only. Set JWT_SECRET in the shell for a non-default secret.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobtrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-before-sharing-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.upload.directory=${UPLOAD_DIRECTORY:uploads/cvs}