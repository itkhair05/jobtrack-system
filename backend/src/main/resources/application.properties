spring.application.name=backend
# Server Port
server.port=8080

# Database Configuration (Cấu hình kết nối MySQL XAMPP)
# Tham số createDatabaseIfNotExist=true sẽ tự động tạo database jobtrack_db nếu chưa có
spring.datasource.url=jdbc:mysql://localhost:3306/jobtrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration (Tự động chạy file V1__init_schema.sql để tạo các bảng)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT Configuration
app.jwt.secret=change-this-secret-key-to-a-secure-value-with-at-least-32-characters
app.jwt.expiration-ms=86400000